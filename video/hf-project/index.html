<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<script src="assets/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0b0b12; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #0b0b12; }
  .scene { position: absolute; inset: 0; display: none; }
  .scene svg { position: absolute; inset: 0; width: 1920px; height: 1080px; }
  #fx { position: absolute; inset: 0; pointer-events: none; }
  #grade, #paper, #grain, #vig, #flash, #leak { position: absolute; inset: 0; pointer-events: none; }
  #paper { background: url(assets/paper.png); background-size: 1920px 1080px; mix-blend-mode: soft-light; opacity: .55; }
  #grain { background: url(assets/grain.png); background-size: 512px 512px; mix-blend-mode: overlay; opacity: .22; }
  #vig { background: radial-gradient(ellipse 75% 70% at 50% 48%, rgba(0,0,0,0) 55%, rgba(8,4,12,.55) 100%); }
  #leak { mix-blend-mode: screen; opacity: 0; background:
      radial-gradient(ellipse 45% 70% at 0% 40%, rgba(255,140,60,.95), rgba(255,90,40,0) 70%),
      radial-gradient(ellipse 30% 60% at 100% 70%, rgba(255,190,90,.8), rgba(255,120,40,0) 70%); }
  #flash { background: #fff3dc; opacity: 0; }
</style>
</head>

<div id="root" data-composition-id="main" data-start="0" data-duration="80" data-width="1920" data-height="1080">

  <div class="scene" id="sc8"><svg id="sv8" viewBox="0 0 1920 1080"></svg></div>
  <div class="scene" id="sc9"><svg id="sv9" viewBox="0 0 1920 1080"></svg></div>
  <canvas id="fx" width="1920" height="1080"></canvas>
